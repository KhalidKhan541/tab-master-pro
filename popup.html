<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Master Pro</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-top">
        <h1 class="logo">Tab Master Pro</h1>
        <div class="header-actions">
          <button id="themeToggle" class="icon-btn" title="Toggle theme">
            <span class="icon-sun">☀</span>
            <span class="icon-moon">☾</span>
          </button>
          <button id="settingsBtn" class="icon-btn" title="Settings">⚙</button>
        </div>
      </div>
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search tabs... (Ctrl+F)" autocomplete="off">
        <button id="clearSearch" class="clear-btn hidden" title="Clear">✕</button>
      </div>
      <div class="stats-bar">
        <span id="tabCount" class="tab-count">0 tabs</span>
        <div class="stats-actions">
          <button id="saveSessionBtn" class="btn btn-primary btn-sm">Save Session</button>
          <button id="restoreSessionBtn" class="btn btn-secondary btn-sm">Restore</button>
          <button id="closeAllBtn" class="btn btn-danger btn-sm">Close All</button>
        </div>
      </div>
      <div id="sessionDropdown" class="session-dropdown hidden">
        <div class="session-header">
          <span>Saved Sessions</span>
          <button id="closeSessionDropdown" class="icon-btn-sm">✕</button>
        </div>
        <div id="sessionList" class="session-list"></div>
      </div>
    </header>

    <main class="app-main">
      <div class="view-toggle">
        <button id="viewAll" class="view-btn active" data-view="all">All</button>
        <button id="viewGrouped" class="view-btn" data-view="grouped">By Domain</button>
        <button id="viewPinned" class="view-btn" data-view="pinned">Pinned</button>
      </div>
      <div id="tabList" class="tab-list" tabindex="0"></div>
      <div id="emptyState" class="empty-state hidden">
        <div class="empty-icon">📑</div>
        <p>No tabs found</p>
      </div>
    </main>

    <div id="contextMenu" class="context-menu hidden">
      <button data-action="close" class="ctx-item">Close Tab</button>
      <button data-action="pin" class="ctx-item">Pin / Unpin</button>
      <button data-action="mute" class="ctx-item">Mute / Unmute</button>
      <button data-action="duplicate" class="ctx-item">Duplicate Tab</button>
      <button data-action="bookmark" class="ctx-item">Bookmark</button>
      <button data-action="moveToWindow" class="ctx-item">Move to New Window</button>
      <div class="ctx-divider"></div>
      <button data-action="closeOthers" class="ctx-item">Close Other Tabs</button>
      <button data-action="closeRight" class="ctx-item">Close Tabs to Right</button>
    </div>
  </div>

  <script type="module" src="utils.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
